<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sthlm Lunch — dagens lunch på ett ställe</title>
  <meta name="description" content="Dagens lunch från kontorets lunchställen, samlat på en sida.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1 class="logo">Sthlm&nbsp;Lunch</h1>
      <p class="today" id="today"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <p class="stamp" id="stamp"></p>
    </div>

    <div class="grid" id="grid"></div>

    <p class="empty" id="empty" hidden>
      Inga restauranger tillagda än. Lägg till dem i <code>data/restaurants.js</code>.
    </p>
  </main>

  <footer class="wrap foot">
    <p>Menyerna hämtas automatiskt varje vardagsmorgon från restaurangernas egna sidor.
       Stämmer något inte — lita på restaurangens sida, inte den här.</p>
  </footer>

  <script src="data/restaurants.js"></script>
  <script src="data/menus.js"></script>
  <script src="app.js"></script>
</body>
</html>
