# Publicerar sidan till GitHub Pages.
#
# Körs i tre fall:
#   1. push till main        — du ändrar något och pushar, sidan uppdateras direkt
#   2. workflow_call         — anropas av lunch.yml efter morgonhämtningen
#   3. workflow_dispatch     — startas för hand från fliken Actions
#
# Varför lunch.yml måste ANROPA den här istället för att lita på push-triggern:
# GitHub startar inga workflows från commits gjorda med GITHUB_TOKEN. En commit
# från automatiken hade alltså aldrig publicerats.

name: Publicera sidan

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref är nödvändigt. Utan det checkar actions/checkout ut den commit som
      # STARTADE körningen. Anropas vi från lunch.yml är det läget FÖRE
      # automatikens commit, så den nyhämtade menyn publiceras aldrig och sidan
      # ligger permanent en körning efter. Med ref hämtas grenens senaste läge.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Sista kontrollen innan något går publikt.
      - name: Kontrollera datan
        run: python3 tools/validate.py

      # HTML och JS cachas var för sig i 10 minuter. Ändras båda samtidigt kan en
      # återvändande besökare få ny HTML men gammal JS, och då kraschar sidan på
      # ett element som inte längre finns. Genom att stämpla filnamnen med
      # commitens id pekar varje HTML-version på exakt de filer den hör ihop med,
      # och blandningen kan inte uppstå.
      - name: Versionsmärk statiska filer
        run: |
          V=$(git rev-parse --short HEAD)
          echo "Versionsmärker med $V"
          # perl istället för sed: sed -i betyder olika saker på Linux och macOS,
          # och mönstren nedan är verifierade med perl.
          for f in index.html restaurang.html; do
            perl -pi -e "s|\"style\\.css\"|\"style.css?v=$V\"|g;
                         s|\"app\\.js\"|\"app.js?v=$V\"|g;
                         s|\"data/restaurants\\.js\"|\"data/restaurants.js?v=$V\"|g;
                         s|\"data/menus\\.js\"|\"data/menus.js?v=$V\"|g" "$f"
          done
          grep -o 'app.js?v=[a-f0-9]*' index.html | head -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
