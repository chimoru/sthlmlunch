# Hämtar veckomenyerna och publicerar sidan.
#
# Körs vardagsmorgnar, året runt.
#
# GitHubs cron känner bara UTC, så 08:00 svensk tid är två olika UTC-tider: 06:00
# på sommaren och 07:00 på vintern. Båda är därför schemalagda, plus en senare
# reservtid.
#
# Grinden frågar INTE vad klockan är. GitHub startar schemalagda körningar när det
# finns kapacitet, inte på utsatt minut — förseningar på en timme är normala. En
# grind som krävde "klockan 08 i Stockholm" hoppade därför över hela dagen när
# körningen kom 09:01, och eftersom överhoppade jobb räknas som lyckade blev det
# varken uppdatering eller larm. Det hände 2026-08-24.
#
# I stället frågar grinden efter datan: har menyerna redan hämtats idag? Då spelar
# det ingen roll när körningen råkar starta, hur många cron-tider som pekar på
# samma dag, eller om ett tidigare försök misslyckades — nästa tar över.
#
# Går också att starta för hand: fliken Actions → "Hämta lunchmenyer" → Run workflow.

name: Hämta lunchmenyer

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 08:00 svensk sommartid
    - cron: "0 7 * * 1-5"   # 08:00 svensk vintertid
    - cron: "0 9 * * 1-5"   # reserv om morgonens körning försenats bort eller misslyckats
  workflow_dispatch:

permissions:
  contents: write   # för att kunna committa data/menus.js
  pages: write      # publiceringen ärver dessa
  id-token: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  # Avgör om den här körningen ska göra jobbet. Flera cron-tider pekar på samma
  # dag, så någon måste hindra dubbelarbete — men utan att kunna hoppa över dagen
  # bara för att GitHub startade sent.
  grind:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.behov.outputs.kor }}
    steps:
      - uses: actions/checkout@v6

      - id: behov
        run: |
          echo "Händelse: ${{ github.event_name }}"
          echo "Svensk tid nu: $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Startad för hand — kör oavsett vad datan säger."
            echo "kor=ja" >> "$GITHUB_OUTPUT"
          else
            SVAR=$(python3 tools/behovs-hamtning.py)
            echo "kor=$SVAR" >> "$GITHUB_OUTPUT"
          fi

  hamta:
    needs: grind
    if: needs.grind.outputs.kor == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # Krävs för att Claudes Read-verktyg ska kunna rendera PDF-sidor till
      # bilder. Flera restauranger lägger menyn i en PDF vars textlager är
      # trasigt — då är den renderade bilden enda tillförlitliga vägen.
      - name: Installera PDF-stöd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Claude läser restauranglistan, besöker varje sida, tolkar menyn
      # och skriver om data/menus.js.
      - name: Hämta menyerna med Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "WebFetch,Read,Write,Edit,Bash(curl:*)"
            --max-turns 60
          prompt: |
            Du uppdaterar lunchmenyerna för en webbsida. Dagens datum framgår av systemet.

            ARBETSGÅNG
            1. Läs data/restaurants.js och notera varje restaurangs "id" och "url".
               HOPPA ÖVER varje restaurang som har "section": "lunch". De har ingen
               veckomeny att hämta — deras kort länkar direkt till restaurangens
               egen sida. Hämta ingenting för dem, och lägg INTE in dem i
               data/menus.js. Saknas fältet "section" gäller "veckomeny".

               HOPPA ÖVER också varje restaurang som har "manual": true. Deras meny
               är fast och lagd för hand. Hämta inte deras sida, och lämna deras post
               i data/menus.js exakt som den är — rör inte ett tecken, inte heller
               "status" eller "fetched". Att försöka läsa deras sida vore både onödigt
               och riskabelt: misslyckas det sätts status till "stale" och larmet går
               varje morgon för en meny som aldrig ändras.
            2. Läs den nuvarande data/menus.js. Den är din utgångspunkt — du ska
               uppdatera den, inte börja om från noll.
            3. Har restaurangen ett "hint"-fält: läs det först. Det beskriver var
               menyn faktiskt finns, och gäller före din egen gissning.
            4. Hämta varje restaurangs "url" med WebFetch och läs ut veckans lunchmeny.
               Leta efter menyn för den innevarande veckan. Finns flera veckor, välj den
               som innehåller dagens datum.
            5. LIGGER MENYN INTE PÅ SIDAN — vanligt — så leta efter en länk till den.
               Den heter ofta "Lunchmeny", "Veckans lunch" eller liknande, och kan
               innehålla ett veckonummer. Följ den länken.
               Är målet en PDF:
                 a) Ladda ner den:  curl -sL "<url>" -o /tmp/meny.pdf
                 b) Läs den med Read på /tmp/meny.pdf. Read renderar sidorna som
                    bilder, vilket fungerar även när PDF:ens textlager är trasigt.
                    Lita INTE på rå text ur en PDF — små bokstäver blir ofta
                    frågetecken, och då hittar du på ord utan att märka det.
               Spara ALDRIG PDF-länken någonstans. Den byts ut varje vecka; den
               ska letas upp på nytt varje körning.
            6. Skriv om data/menus.js med Write.

            FILENS FORMAT
            Filen börjar med kommentarsblocket som redan finns — behåll det ordagrant.
            Därefter "window.MENUS = " följt av ETT objekt i STRIKT JSON:

            {
              "fetched": "<nu, ISO 8601 med Z>",
              "week": <veckonummer som heltal>,
              "restaurants": {
                "<restaurangens id>": {
                  "status": "ok" | "stale" | "error",
                  "fetched": "<när just denna hämtades, ISO 8601 med Z>",
                  "week": <veckonummer som RESTAURANGENS sida anger, heltal.
                           Utelämna fältet helt om sidan inte anger något.>,
                  "priceInfo": "<prisuppgift ordagrant från sidan, eller \"\">",
                  "days": [
                    {
                      "weekday": "Måndag" | "Tisdag" | "Onsdag" | "Torsdag" | "Fredag" | "Lördag" | "Söndag",
                      "date": "ÅÅÅÅ-MM-DD",
                      "dishes": [
                        {
                          "name": "<rättens namn>",
                          "desc": "<tillbehör och beskrivning, eller \"\">",
                          "price": "<pris ordagrant, t.ex. \"135 kr\", eller \"\">"
                        }
                      ]
                    }
                  ],
                  "always": [
                    {
                      "name": "<rätt som finns hela veckan, t.ex. \"Köttbullar\">",
                      "desc": "", "price": "<pris ordagrant>"
                    }
                  ]
                }
              }
            }

            Både "week" och "always" är frivilliga — utelämna dem helt om sidan
            inte har någon sådan uppgift. Hitta aldrig på ett veckonummer.

            INGA kommentarer inuti JSON-objektet. Inget kommatecken efter sista posten.
            Inga andra fält än de som står ovan. Filen kontrolleras maskinellt direkt
            efteråt och en avvikelse gör att ingenting publiceras.

            REGLER SOM GÄLLER FÖRE ALLT ANNAT
            - Hitta ALDRIG på rätter, priser eller dagar. Är du osäker, utelämna.
            - Priser skrivs ordagrant som de står på sidan. Räkna aldrig om, avrunda aldrig.
            - Går en sida inte att läsa, eller hittar du ingen meny för veckan: sätt
              status "stale" för den restaurangen och BEHÅLL dess "days" och "priceInfo"
              exakt som de var i den gamla filen. Rör inte dess gamla "fetched".
              Radera aldrig data du inte kunde ersätta.
            - Finns ingen gammal data alls för en restaurang som inte gick att läsa:
              status "error" och "days": [].
            - Lyckas hämtningen: status "ok" och "fetched" satt till nu.
            - Saknar en dag meny på sidan (t.ex. stängt): ta med dagen med "dishes": [].
            - "date" skriver du BARA om sidan faktiskt tryckt ett datum för dagen.
              Räkna aldrig fram datum ur ett veckonummer och gissa aldrig — utelämna
              fältet i stället. Sidan hittar dagens dag på veckodagens namn ändå.
            - Anger sidan ett veckonummer: skriv det i "week" ORDAGRANT som det står,
              även om det ser fel ut. Sidan jämför själv med den pågående veckan och
              varnar besökaren. Rätta aldrig ett veckonummer du tror är felaktigt.
            - Rätter som gäller hela veckan (à la carte, "alltid på menyn") hör inte
              till någon dag — lägg dem i "always" med sina egna priser.
            - Kostmärkning som "veg" eller "vegetarisk" ska INTE läggas i egna fält.
              Står det på restaurangens sida hör det i "desc", ordagrant. Sidan visar
              inga kostetiketter — det framgår av rätten själv.
            - Allergenmarkeringar som (L), (Ä), (G), (N) betyder att rätten INNEHÅLLER
              laktos, ägg, gluten eller nötter. Låt dem stå kvar i "desc" ordagrant,
              så besökaren ser dem. Tolka dem aldrig som att rätten är fri från något.
            - Är restauranglistan tom, ändra ingenting.
            - Finns en post i menus.js vars id inte längre är en "veckomeny"-restaurang
              i restaurants.js: ta bort posten. Den visas inte på sidan ändå. Poster
              för restauranger med "manual": true ska däremot ALLTID behållas orörda.

            Skriv bara filen. Committa inte, pusha inte, kör inga kommandon.

      # Vakten: är filen hel? Annars avbryts hela körningen här och nu,
      # ingenting committas, och den gamla sidan ligger kvar.
      - name: Kontrollera datan
        run: python3 tools/validate.py

      # Committa bara om menyerna faktiskt ändrats. Git-historiken blir därmed
      # en logg över när varje restaurang bytte meny.
      - name: Committa om något ändrats
        run: |
          if git diff --quiet -- data/menus.js; then
            echo "Menyerna är oförändrade sedan förra körningen — ingen commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/menus.js
            git commit -m "Uppdatera lunchmenyer $(date -u +%Y-%m-%d)"
            git push
            echo "Menyerna har ändrats och är committade."
          fi

  # Publicerar med samma steg som en vanlig push gör. Se kommentaren i deploy.yml
  # om varför automatikens commit inte kan publicera sig själv.
  publicera:
    needs: hamta
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Larmar om någon restaurang inte kunde läsas. Ligger EFTER publiceringen med
  # flit: en trasig restaurangsida ska inte hindra de fungerande från att
  # uppdateras. Blir jobbet rött mejlar GitHub dig automatiskt.
  larm:
    needs: publicera
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - run: python3 tools/kontrollera-status.py
